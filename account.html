<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Account – AIHub</title>

  <meta name="description"
        content="Manage your AIHub account.">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .account-container {
      width: 90%;
      max-width: 450px;
      margin: 80px auto;
      padding: 35px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
      box-sizing: border-box;
    }

    .icon {
      font-size: 55px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .email {
      color: #666;
      word-break: break-word;
    }

    .status {
      margin: 25px 0;
      padding: 15px;
      background: #f5f7fb;
      border-radius: 10px;
    }
     .upgrade-button {
  display: block;
  margin-top: 15px;
  padding: 12px;
  background: #4f46e5;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
}

.upgrade-button:hover {
  opacity: 0.9;
}
    
    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #dc2626;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: block;
      margin-top: 20px;
      color: #4f46e5;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="account-container">

    <div class="icon">👤</div>

    <h1>My Account</h1>

    <p class="email" id="userEmail">
      Loading...
    </p>

    <div class="status">
  ⭐ <strong id="planName">Loading Plan...</strong>
  <br>
  <span id="planDescription">Checking your current plan...</span>

  <a href="pricing.html" class="upgrade-button">
    ⭐ View AIHub Pro
  </a>
</div>

    <button id="logoutButton">
      🚪 Logout
    </button>

    <a href="index.html" class="back">
      ← Back to AIHub
    </a>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://stjkvlkeysyefhxocjzm.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_TGBEUnPnXQMw82y6X2hQiA_CLfc9ffB";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

  async function loadAccount() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    window.location.href = "login.html";
    return;
  }

  document.getElementById("userEmail").textContent =
    session.user.email;

  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("plan")
    .eq("user_id", session.user.id)
    .single();

  if (error) {
    console.error("Profile error:", error);
    document.getElementById("planName").textContent = "Free Plan";
    document.getElementById("planDescription").textContent =
      "You're currently using the AIHub Free Plan.";
    return;
  }

  if (profile.plan === "pro") {
    document.getElementById("planName").textContent = "Pro Plan ⭐";
    document.getElementById("planDescription").textContent =
      "You're currently using AIHub Pro.";
  } else {
    document.getElementById("planName").textContent = "Free Plan";
    document.getElementById("planDescription").textContent =
      "You're currently using the AIHub Free Plan.";
  }
}

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = "login.html";
        return;
      }

      document.getElementById("userEmail").textContent =
        session.user.email;
    }

    document.getElementById("logoutButton").addEventListener("click", async function() {

      const { error } = await supabaseClient.auth.signOut();

      if (error) {
        alert("Logout failed: " + error.message);
        return;
      }

      window.location.href = "login.html";
    });

    loadAccount();
  </script>

</body>
</html>
