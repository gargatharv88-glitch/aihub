<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password – AIHub</title>

  <meta name="description"
        content="Reset your AIHub account password.">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: 80px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #ecfdf5;
      color: #047857;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      margin-top: 25px;
    }

    @media (max-width: 500px) {
      .container {
        margin: 30px 15px;
        padding: 25px 20px;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="container">

    <h1>Forgot Password?</h1>

    <p class="subtitle">
      Enter your email and we'll send you a password reset link.
    </p>

    <form id="resetForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your AIHub email"
        required
      >

      <button type="submit">
        Send Reset Link
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="links">
      <a href="login.html">← Back to Login</a>
    </div>

    <div class="links back">
      <a href="index.html">← Back to AIHub</a>
    </div>

  </div>


<script>

  const SUPABASE_URL =
    "https://stjkvlkeysyefhxocjzm.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_TGBEUnPnXQMw82y6X2hQiA_CLfc9ffB";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const resetForm =
    document.getElementById("resetForm");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";
  }


  resetForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        document.getElementById("email").value.trim();


      const redirectUrl =
        window.location.origin +
        window.location.pathname
          .replace("forgot-password.html", "reset-password.html");


      const { error } =
        await supabaseClient.auth.resetPasswordForEmail(
          email,
          {
            redirectTo: redirectUrl
          }
        );


      if (error) {

        showMessage(
          "Could not send reset email: " +
          error.message,
          "error"
        );

        return;
      }


      showMessage(
        "Reset link sent! Check your email 📧",
        "success"
      );

    });

</script>

</body>
</html>
