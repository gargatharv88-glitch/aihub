<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password – AIHub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: 80px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      line-height: 1.5;
    }

    .success {
      background: #ecfdf5;
      color: #047857;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .back {
      text-align: center;
      margin-top: 20px;
    }

    .back a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: bold;
    }

    #passwordForm {
      display: none;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="container">

  <h1>Reset Password</h1>

  <p class="subtitle" id="subtitle">
    Checking your password reset link...
  </p>

  <form id="passwordForm">

    <label for="password">
      New Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Enter new password"
      minlength="6"
      required
    >

    <label for="confirmPassword">
      Confirm Password
    </label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm new password"
      minlength="6"
      required
    >

    <button type="submit" id="updateButton">
      Update Password
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="back">
    <a href="login.html">← Back to Login</a>
  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://stjkvlkeysyefhxocjzm.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_TGBEUnPnXQMw82y6X2hQiA_CLfc9ffB";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );


  const form =
    document.getElementById("passwordForm");

  const message =
    document.getElementById("message");

  const subtitle =
    document.getElementById("subtitle");

  const updateButton =
    document.getElementById("updateButton");


  let recoverySessionReady = false;


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";
  }


  function showPasswordForm() {

    recoverySessionReady = true;

    subtitle.textContent =
      "Enter your new AIHub password below.";

    form.style.display = "block";

    message.style.display = "none";
  }


  function showInvalidLink() {

    recoverySessionReady = false;

    form.style.display = "none";

    subtitle.textContent =
      "This password reset link is invalid or has expired.";

    showMessage(
      "Please request a new password reset link from the Forgot Password page.",
      "error"
    );
  }


  /*
    Supabase sends PASSWORD_RECOVERY when the
    password-reset link successfully creates
    the recovery session.
  */

  supabaseClient.auth.onAuthStateChange(
    async function(event, session) {

      if (
        event === "PASSWORD_RECOVERY" &&
        session
      ) {

        showPasswordForm();

      }

    }
  );


  /*
    Also check the current session directly.
    This handles cases where the recovery session
    is already available before the listener runs.
  */

  async function checkRecoverySession() {

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();


    if (error) {

      showInvalidLink();

      return;

    }


    if (data && data.session) {

      showPasswordForm();

      return;

    }


    /*
      Give Supabase a moment to process the
      recovery information from the URL.
    */

    setTimeout(
      async function() {

        const {
          data: retryData
        } = await supabaseClient.auth.getSession();


        if (
          retryData &&
          retryData.session
        ) {

          showPasswordForm();

        } else {

          showInvalidLink();

        }

      },
      1000
    );

  }


  checkRecoverySession();


  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      if (!recoverySessionReady) {

        showMessage(
          "Your reset session is not ready. Please open the reset link again.",
          "error"
        );

        return;

      }


      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;

      }


      if (password !== confirmPassword) {

        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;

      }


      updateButton.disabled = true;

      updateButton.textContent =
        "Updating Password...";


      /*
        Make absolutely sure a session exists
        immediately before updating the password.
      */

      const {
        data: sessionData,
        error: sessionError
      } =
        await supabaseClient.auth.getSession();


      if (
        sessionError ||
        !sessionData ||
        !sessionData.session
      ) {

        showMessage(
          "Your reset session has expired. Please request a new reset link.",
          "error"
        );

        updateButton.disabled = false;

        updateButton.textContent =
          "Update Password";

        return;

      }


      const {
        error
      } =
        await supabaseClient.auth.updateUser({
          password: password
        });


      if (error) {

        showMessage(
          "Password update failed: " +
          error.message,
          "error"
        );

        updateButton.disabled = false;

        updateButton.textContent =
          "Update Password";

        return;

      }


      showMessage(
        "Password updated successfully! 🎉 Redirecting to login...",
        "success"
      );


      /*
        Sign out the recovery session so the user
        can log in normally with the new password.
      */

      await supabaseClient.auth.signOut();


      setTimeout(
        function() {

          window.location.href =
            "login.html";

        },
        1500
      );

    });

</script>

</body>
</html>
