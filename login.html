<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login – AIHub</title>

  <meta name="description" content="Login to your AIHub account.">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .login-container {
      max-width: 420px;
      margin: 70px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .back-top {
      margin-bottom: 25px;
    }

    .back-top a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: #4f46e5;
    }

    .forgot {
      text-align: right;
      margin-top: 10px;
    }

    .forgot a {
      color: #4f46e5;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .forgot a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #ecfdf5;
      color: #047857;
    }

    .error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
    }

    .signup a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .login-container {
        margin: 30px 15px;
        padding: 25px 20px;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="login-container">

    <div class="back-top">
      <a href="index.html">← Back to AIHub</a>
    </div>

    <h1>Welcome to AIHub</h1>

    <p class="subtitle">
      Login to access your AIHub account.
    </p>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <div class="forgot">
        <a href="forgot-password.html">
          Forgot Password?
        </a>
      </div>

      <button id="loginButton" type="submit">
        Login
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">Create account</a>
    </div>

  </div>


<script>

  const SUPABASE_URL =
    "https://stjkvlkeysyefhxocjzm.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_TGBEUnPnXQMw82y6X2hQiA_CLfc9ffB";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";


      const { error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,
          password: password

        });


      if (error) {

        showMessage(
          "Login failed: " + error.message,
          "error"
        );

        loginButton.disabled = false;
        loginButton.textContent = "Login";

        return;
      }


      showMessage(
        "Login successful! 🎉",
        "success"
      );


      setTimeout(function() {

        window.location.href = "index.html";

      }, 700);

    });

</script>

</body>
</html>
