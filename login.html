<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login – AIHub</title>

  <meta name="description"
        content="Login to your AIHub account.">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .login-container {
      max-width: 420px;
      margin: 80px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
    }

    .signup a,
    .back a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      text-align: center;
      margin-top: 25px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="login-container">

    <h1>Welcome to AIHub</h1>

    <p class="subtitle">
      Login to access your AIHub account.
    </p>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <div class="signup">
      Don't have an account?
      <a href="#">Create account</a>
    </div>

    <div class="back">
      <a href="index.html">← Back to AIHub</a>
    </div>

  </div>
<script>
  
  const SUPABASE_URL = "https://stjkvlkeysyefhxocjzm.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_TGBEUnPnXQMw82y6X2hQiA_CLfc9ffB";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
</script>
 <script>
  const loginForm = document.getElementById("loginForm");

  loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      alert("Login failed: " + error.message);
      return;
    }

    alert("Login successful! 🎉");

    window.location.href = "index.html";
  });
</script>
  
</body>
</html>
