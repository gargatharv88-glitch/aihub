<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account – AIHub</title>

  <meta name="description"
        content="Create your AIHub account.">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .signup-container {
      max-width: 420px;
      margin: 80px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login,
    .back {
      text-align: center;
      margin-top: 20px;
    }

    a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="signup-container">

    <h1>Create your AIHub account</h1>

    <p class="subtitle">
      Sign up to get started with AIHub.
    </p>

    <form id="signupForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <button type="submit">
        Create Account
      </button>

    </form>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <div class="back">
      <a href="index.html">← Back to AIHub</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://stjkvlkeysyefhxocjzm.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_TGBEUnPnXQMw82y6X2hQiA_CLfc9ffB";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const signupForm = document.getElementById("signupForm");

    signupForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabaseClient.auth.signUp({
  email: email,
  password: password,
  options: {
    emailRedirectTo: "https://gargatharv88-glitch.github.io/aihub/verified.html"
  }
});

      if (error) {
        alert("Signup failed: " + error.message);
        return;
      }

      alert("Account created! Please check your email if confirmation is required.");

      window.location.href = "login.html";
    });
  </script>

</body>
</html>
