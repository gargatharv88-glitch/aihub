<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Email Verified – AIHub</title>

  <meta name="description"
        content="Your AIHub email has been successfully verified.">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .verified-container {
      width: 90%;
      max-width: 450px;
      padding: 35px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
      box-sizing: border-box;
    }

    .icon {
      font-size: 60px;
      margin-bottom: 10px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    .login-button {
      display: block;
      margin-top: 25px;
      padding: 13px;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .home-link {
      display: block;
      margin-top: 18px;
      color: #4f46e5;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="verified-container">

    <div class="icon">✅</div>

    <h1>Email Verified!</h1>

    <p>
      Your AIHub email has been successfully verified.
    </p>

    <p>
      Your account is now ready to use.
    </p>

    <a href="login.html" class="login-button">
      Continue to Login
    </a>

    <a href="index.html" class="home-link">
      ← Back to AIHub
    </a>

  </div>

</body>
</html>
